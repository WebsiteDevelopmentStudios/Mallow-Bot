name: Validate Mallow Bot

on:
  push:
    branches: ["main", "migration/full-rust-bot"]
  pull_request:

concurrency:
  group: rust-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-bot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - name: Ensure movie and media-hosting code is absent
        working-directory: .
        run: '! grep -RniE "movie|tmdb|ffmpeg|ffprobe|hls|media-hosting" rust-bot/src'
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Build production Docker image
        working-directory: .
        run: docker build -f bot.Dockerfile -t mallow-bot-rust:ci .

  bot-hosting-binary:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bot -> target
      - name: Build bot-hosting.net Linux executable
        working-directory: rust-bot
        run: cargo build --release
      - name: Package executable
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          BINARY="target/release/mallow-bot"
          if [ ! -x "$BINARY" ]; then
            echo "Expected executable not found: $BINARY"
            echo "Available mallow-bot binaries:"
            find . -maxdepth 7 -type f -name 'mallow-bot*' -print
            exit 1
          fi
          cp "$BINARY" artifact/mallow-bot-linux-x86_64
          chmod +x artifact/mallow-bot-linux-x86_64
          test -s artifact/mallow-bot-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: mallow-bot-linux-x86_64
          path: artifact/mallow-bot-linux-x86_64
          if-no-files-found: error
          retention-days: 30
