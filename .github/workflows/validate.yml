name: Validate Mallow Bot

on:
  push:
    branches: ["main", "migration/full-rust-bot"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-bot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Build production Docker image
        working-directory: .
        run: docker build -f bot.Dockerfile -t mallow-bot-rust:ci .
