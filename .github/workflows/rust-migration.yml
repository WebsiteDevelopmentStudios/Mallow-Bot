name: Rust migration checks

on:
  push:
    branches: [migration/full-rust-bot]
    paths:
      - "rust-bot/**"
      - "bot.Dockerfile"
      - "render.yaml"
      - ".github/workflows/rust-migration.yml"
  pull_request:
    paths:
      - "rust-bot/**"
      - "bot.Dockerfile"
      - "render.yaml"
      - ".github/workflows/rust-migration.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        working-directory: rust-bot
        run: cargo fmt --all -- --check
      - name: Check all targets
        working-directory: rust-bot
        run: cargo check --all-targets
      - name: Run tests
        working-directory: rust-bot
        run: cargo test --all-targets
      - name: Release build
        working-directory: rust-bot
        run: cargo build --release
      - name: Build production image
        run: docker build -f bot.Dockerfile -t mallow-bot-rust:ci .
