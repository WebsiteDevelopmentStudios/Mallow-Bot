name: Build bot-hosting binary

on:
  push:
    branches: ["main"]
    paths:
      - "rust-bot/**"
      - "start.sh"
      - ".github/workflows/build-bot-hosting.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-hosting-binary
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bot -> target
      - name: Build Linux executable
        working-directory: rust-bot
        run: cargo build --release
      - name: Package executable
        run: |
          mkdir -p artifact
          BINARY="$(find . -type f -path '*/release/mallow-bot' -print -quit)"
          if [ -z "$BINARY" ]; then
            echo "Could not find the compiled mallow-bot executable."
            find . -type f -path '*/release/*' -maxdepth 6 -print | head -100
            exit 1
          fi
          cp "$BINARY" artifact/mallow-bot-linux-x86_64
          chmod +x artifact/mallow-bot-linux-x86_64
      - name: Publish latest bot-hosting build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bot-hosting-latest
          name: Bot-hosting latest build
          prerelease: true
          make_latest: false
          files: artifact/mallow-bot-linux-x86_64
