name: Build bot-hosting binary

on:
  push:
    branches: ["main"]
    paths:
      - "rust-bot/**"
      - "start.sh"
      - ".github/workflows/build-bot-hosting.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-hosting-binary
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build Linux executable
        run: cargo build --release --locked --bin mallow-bot
      - name: Verify and package executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          BINARY=""
          for candidate in target/release/mallow-bot rust-bot/target/release/mallow-bot; do
            if [ -f "$candidate" ] && [ -x "$candidate" ]; then
              BINARY="$candidate"
              break
            fi
          done
          if [ -z "$BINARY" ]; then
            echo "Build completed but the mallow-bot executable was not found."
            echo "Workspace target directory: ${CARGO_TARGET_DIR:-target}"
            find . -maxdepth 7 -type f -name 'mallow-bot*' -print
            ls -la target/release 2>/dev/null || true
            ls -la rust-bot/target/release 2>/dev/null || true
            exit 1
          fi
          cp "$BINARY" artifact/mallow-bot-linux-x86_64
          chmod +x artifact/mallow-bot-linux-x86_64
          file artifact/mallow-bot-linux-x86_64
          test -s artifact/mallow-bot-linux-x86_64
      - name: Publish latest bot-hosting build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bot-hosting-latest
          name: Bot-hosting latest build
          prerelease: true
          make_latest: false
          files: artifact/mallow-bot-linux-x86_64
