<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile · Mallow Bot</title><style>:root{color-scheme:dark;font:16px Inter,system-ui,sans-serif;background:#0b0711;color:#faf7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#42156b,transparent 42%),#0b0711;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:24px}.panel{background:#171020;border:1px solid #382448;border-radius:20px;padding:24px;margin-top:20px}.muted{color:#b7a9c9}a,button{color:white;background:#7e22ce;border:0;border-radius:10px;padding:11px 15px;text-decoration:none;cursor:pointer;font-weight:800}.profile{display:flex;gap:18px;align-items:center}.avatar{width:88px;height:88px;border-radius:50%;border:3px solid #a855f7}.status{color:#d8a7ff}</style></head><body><main class="wrap"><header><a href="/server-select.html">← Servers</a> <strong style="margin-left:12px">☁ Mallow Bot / Profile</strong></header><section class="panel"><h1>My Discord profile</h1><div class="profile"><img id="avatar" class="avatar" alt="Discord avatar"><div><h2 id="name">Loading…</h2><p id="handle" class="muted"></p><p id="id" class="muted"></p></div></div><p id="status" class="status"></p></section><script>async function boot(){try{const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok)throw Error('Please sign in first.');const d=await r.json();if(!d.user){location.href='/api/login';return}const u=d.user;document.getElementById('name').textContent=u.global_name||u.username;document.getElementById('handle').textContent='@'+u.username;document.getElementById('id').textContent='Discord ID: '+u.id;document.getElementById('avatar').src=u.avatar_url||'https://cdn.discordapp.com/embed/avatars/0.png';document.getElementById('status').textContent='Signed in with Discord.'}catch(e){document.getElementById('status').textContent=e.message}}boot();</script></main></body></html>
