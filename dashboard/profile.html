</style></head><body><main class="wrap"><header class="site-header"><a class="brand-lockup" href="/server-select.html" aria-label="Mallow Bot home"><img class="brand-icon" src="https://raw.githubusercontent.com/WebsiteDevelopmentStudios/Mallow-Bot/main/MallowBot.png" alt="Mallow Bot" onerror="this.style.display='none'"><span>Mallow<span class="brand-accent">Bot</span></span></a><nav class="main-nav" aria-label="Main navigation"><a href="/server-select.html">Servers</a><a href="/profile.html">Profile</a><a href="/tutorials.html">Tutorials</a><a href="/commands.html">Commands</a><a href="/support.html">Support</a><a href="/premium.html">Premium</a><a href="/subscriptions.html">Subscriptions</a><a href="/developer.html">Developer</a><a href="/channels.html">Channels</a></nav><div class="nav-user"><span id="topUser" class="nav-user-name muted"></span><button id="logout" class="button-quiet">Sign out</button></div></header><section class="panel"><h1>My Discord profile</h1><div class="profile"><img id="avatar" class="avatar" alt="Discord avatar"><div><h2 id="name">Loading…</h2><p id="handle" class="muted"></p><p id="id" class="muted"></p></div></div><p id="status" class="status"></p></section><script>document.querySelector('[data-nav="profile"]')?.classList.add('active');const navLogout=document.getElementById('logout');if(navLogout)navLogout.onclick=async()=>{try{await fetch('/api/logout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'})}finally{location.href='/'}};async function boot(){try{const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok)throw Error('Please sign in first.');const d=await r.json();if(!d.user){location.href='/api/login';return}const u=d.user;const topUser=document.getElementById('topUser');if(topUser)topUser.textContent=u.global_name||u.username;document.getElementById('name').textContent=u.global_name||u.username;document.getElementById('handle').textContent='@'+u.username;document.getElementById('id').textContent='Discord ID: '+u.id;document.getElementById('avatar').src=u.avatar_url||'https://cdn.discordapp.com/embed/avatars/0.png';document.getElementById('status').textContent='Signed in with Discord.'}catch(e){document.getElementById('status').textContent=e.message}}boot();</script></main><script src="/mobile-nav.js" defer></script></body></html>
