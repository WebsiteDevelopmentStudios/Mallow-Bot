<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · Mallow Bot</title><link rel="stylesheet" href="/mallow.css"></head><body><main class="wrap"><header><a href="/server-select.html">← Servers</a> <strong style="margin-left:12px">☁ Mallow Bot / Profile</strong></header><section class="panel"><h1>My Discord profile</h1><div class="profile"><img id="avatar" class="avatar" alt="Discord avatar"><div><h2 id="name">Loading…</h2><p id="handle" class="muted"></p><p id="id" class="muted"></p></div></div><p id="status" class="status"></p></section><script>async function boot(){try{const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok)throw Error('Please sign in first.');const d=await r.json();if(!d.user){location.href='/api/login';return}const u=d.user;document.getElementById('name').textContent=u.global_name||u.username;document.getElementById('handle').textContent='@'+u.username;document.getElementById('id').textContent='Discord ID: '+u.id;document.getElementById('avatar').src=u.avatar_url||'https://cdn.discordapp.com/embed/avatars/0.png';document.getElementById('status').textContent='Signed in with Discord.'}catch(e){document.getElementById('status').textContent=e.message}}boot();</script></main></body></html>
